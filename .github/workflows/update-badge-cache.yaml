name: Update Cache File

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badge-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-cache:
    runs-on: ubuntu-latest
    env:
      USERS: ${{ vars.USERS }}
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Update cache file
        run: |
          npm run update-cache

      - name: Commit changes
        id: commit_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- public/cache/base64.txt
          if ! git diff --cached --quiet -- public/cache/base64.txt; then
            git commit -m "Update cache file"
            echo "changes_detected=true" >> $GITHUB_ENV
          else
            echo "No changes to commit."
            echo "changes_detected=false" >> $GITHUB_ENV
          fi

      - name: Push changes
        if: env.changes_detected == 'true'
        run: git push origin "HEAD:$TARGET_BRANCH"
